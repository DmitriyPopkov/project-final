<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LessonClient - Главная</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px 15px 0 0;
            border: none;
        }
        .menu-btn {
            width: 100%;
            margin-bottom: 10px;
            padding: 20px;
            font-size: 18px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .menu-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        .editors-btn { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white; border: none; }
        .editors-btn.disabled { background: #ccc; pointer-events: none; }
        .news-btn { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); color: white; border: none; }
        .notices-btn { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); color: white; border: none; }
        .stickers-btn { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); color: white; border: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header text-center">
                        <h1 class="mb-0">LessonClient</h1>
                        <p class="mb-0 opacity-75">Выберите сущность для управления</p>
                        <div th:if="${editorProfile}" class="mt-2">
                            <span class="badge bg-primary">
                                <i class="bi bi-person"></i> 
                                <span th:text="${editorProfile.firstname + ' ' + editorProfile.lastname}">Editor Name</span>
                            </span>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <a th:href="@{/editors}" class="menu-btn editors-btn">
                                    <i class="bi bi-person-badge"></i> Editors
                                    <span th:if="${editorProfile != null}" class="badge bg-success ms-2">Активен</span>
                                </a>
                            </div>
                            <div class="col-md-6">
                                <a th:href="@{/news}" class="menu-btn news-btn">
                                    <i class="bi bi-newspaper"></i> News
                                </a>
                            </div>
                            <div class="col-md-6">
                                <a th:href="@{/notices}" class="menu-btn notices-btn">
                                    <i class="bi bi-volume-up"></i> Notices
                                </a>
                            </div>
                            <div class="col-md-6">
                                <a th:href="@{/stickers}" class="menu-btn stickers-btn">
                                    <i class="bi bi-emoji-smile"></i> Stickers
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
