<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editor Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1 th:text="${editorId != null ? 'Edit Editor' : 'Create New Editor'}">Editor Form</h1>

    <form th:action="${editorId != null ? '/editors/' + editorId + '/edit' : '/editors/create'}" method="post">
        
        <div class="mb-3">
            <label for="login" class="form-label">Login</label>
            <input type="text" class="form-control" id="login" name="login" th:value="${editor?.login}" required>
        </div>
        
        <div class="mb-3">
            <label for="firstname" class="form-label">First Name</label>
            <input type="text" class="form-control" id="firstname" name="firstname" th:value="${editor?.firstname}" required>
        </div>
        
        <div class="mb-3">
            <label for="lastname" class="form-label">Last Name</label>
            <input type="text" class="form-control" id="lastname" name="lastname" th:value="${editor?.lastname}" required>
        </div>
        
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" th:value="${editor?.password}" required>
            <div class="form-text" th:if="${editorId != null}">Введите новый пароль или оставьте пустым, чтобы оставить старый</div>
        </div>
        
        <button type="submit" class="btn btn-primary">Save</button>
        <a th:href="@{/editors}" class="btn btn-secondary">Cancel</a>
    </form>

    <div th:if="${success}" style="color: green; margin-top: 20px;">
        <p th:text="${message}">Success message</p>
    </div>
    <div th:if="${error}" style="color: red; margin-top: 20px;">
        <p th:text="${error}">Error message</p>
    </div>
</div>

<a th:href="@{/editors}" class="btn btn-link">Back to list</a>
</body>
</html>
