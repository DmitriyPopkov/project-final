<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Notices</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .custom-navbar {
            padding: 10px;
            font-size: 20px;
            background-color: #638cab;
            color: #333333;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border-radius: 5px;
        }
        .custom-navbar .navbar-nav > li > a {
            color: #333333;
        }
        .custom-navbar .navbar-nav > li:hover {
            background-color: #e7e7e7;
        }
        .custom-navbar .navbar-nav > li:hover > a {
            color: #555555;
        }
        .custom-navbar .dropdown-menu {
            background-color: #f8f8f8;
        }
        .custom-navbar .dropdown-menu > li > a {
            color: #333333;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        #dynamicTable {
            border-collapse: collapse;
            width: 100%;
            margin-bottom: 20px;
        }
        #dynamicTable, #dynamicTable th, #dynamicTable td {
            border: 2px solid #000000;
        }
        #dynamicTable th, #dynamicTable td {
            padding: 8px;
            text-align: left;
        }
        #dynamicTable th {
            background-color: #ffffff;
            color: #000000;
        }
        #dynamicTable td {
            background-color: #ffffff;
            color: #000000;
        }
        
        .content-edit-container {
            display: none;
        }
    </style>
</head>
<body>
<header>
    <nav class="navbar navbar-expand-lg navbar-light navbar-custom custom-navbar">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Меню</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbar">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" th:href="@{/}">Главная страница</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" data-bs-toggle="modal" data-bs-target="#contactModal">Контакты</a></li>
                </ul>
            </div>
        </div>
    </nav>
</header>
<main>
<h1>Notices</h1>
<button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#noticeModal" th:if="${currentUserRole == 'ADMIN' or currentUserRole == 'ROLE_ADMIN'or currentUserRole == 'EDITOR' or currentUserRole == 'USER' }">
    Create New Notice
</button>
    <table border="1",
           id="dynamicTable">
    <thead>
    <tr>
        <th>ID</th>
        <th>Content</th>
        <th>News</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="notice : ${notices}">
        <td th:text="${notice.id}">1</td>
        <td>
            <span th:id="'content-display-' + ${notice.id}" th:text="${notice.content}">Content</span>
            <div th:id="'content-edit-' + ${notice.id}" class="content-edit-container">
                <textarea th:id="'textarea-' + ${notice.id}" th:text="${notice.content}" style="width: 100%; height: 100px;"></textarea>
            </div>
        </td>
        <td th:text="${notice.newsTitle != null ? notice.newsTitle : 'N/A'}">News Title</td>
        <td>
            <a th:href="@{/news/{id}(id=${notice.newsId})}" class="btn btn-sm btn-info">View</a>
            <button type="button" class="btn btn-sm btn-warning edit-btn" th:data-id="${notice.id}" th:if="${currentUserRole == 'ADMIN'}">Edit</button>
            <button type="button" class="btn btn-sm btn-warning edit-btn" th:data-id="${notice.id}" disabled th:if="${currentUserRole != 'ADMIN'}">Edit</button>
            <button type="button" class="btn btn-sm btn-success save-btn" th:data-id="${notice.id}" style="display:none;" th:if="${currentUserRole == 'ADMIN'}">Save</button>
            <button type="button" class="btn btn-sm btn-success save-btn" th:data-id="${notice.id}" style="display:none;" disabled th:if="${currentUserRole != 'ADMIN'}">Save</button>
            <form th:action="@{/notices/{id}/delete(id=${notice.id})}" method="post" style="display:inline;" th:if="${currentUserRole == 'ADMIN'}">
                <button type="submit" class="btn btn-sm btn-danger">Delete</button>
            </form>
            <button type="button" class="btn btn-sm btn-danger" disabled th:if="${currentUserRole != 'ADMIN'}">Delete</button>
        </td>
    </tr>
    </tbody>
</table>

<div th:if="${success}" style="color: green;">
    <p th:text="${message}">Success message</p>
</div>
<div th:if="${error}" style="color: red;">
    <p th:text="${error}">Error message</p>
</div>

<!-- Modal for Create Notice -->
<div class="modal fade" id="noticeModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Create New Notice</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form th:action="@{/notices}" method="post">
                    <div class="mb-3">
                        <label for="newsId" class="form-label">News Title:</label>
                        <select id="newsId" name="newsId" class="form-select">
                            <option value="">Select news...</option>
                            <option th:each="news : ${newsList}"
                                    th:value="${news.id}"
                                    th:text="${news.title}"
                                    th:selected="${newsId != null and news.id == newsId}"></option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="content" class="form-label">Content:</label>
                        <textarea id="content" name="content" class="form-control" rows="5"></textarea>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="submit" class="btn btn-primary">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

</main>
<!-- Modal Contact Info -->
<div class="modal fade" id="contactModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Контакты</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p><strong>Имя:</strong> Попков Дмитрий</p>
                <p><strong>Email:</strong> <a href="mailto:rutcha@rambler.ru">rutcha@rambler.ru</a></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
            </div>
        </div>
    </div>
</div>

<!-- Hidden form for inline edit -->
<form id="editNoticeForm" method="post" style="display:none;">
    <input type="hidden" id="editNoticeId" name="id">
    <input type="hidden" id="editNoticeContent" name="content">
    <input type="hidden" name="newsId" id="editNoticeNewsId">
</form>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:if="${param.openModal}" type="text/javascript">
    document.addEventListener('DOMContentLoaded', function() {
        var noticeModal = new bootstrap.Modal(document.getElementById('noticeModal'));
        noticeModal.show();
    });
</script>
<script type="text/javascript">
    document.addEventListener('DOMContentLoaded', function() {
        // Edit button click handler
        document.querySelectorAll('.edit-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                const id = this.getAttribute('data-id');
                const contentDisplay = document.getElementById('content-display-' + id);
                const contentEditContainer = document.getElementById('content-edit-' + id);
                const textarea = document.getElementById('textarea-' + id);
                const saveBtn = document.querySelector('.save-btn[data-id="' + id + '"]');
                
                if (contentDisplay && contentEditContainer && textarea && saveBtn) {
                    contentDisplay.style.display = 'none';
                    contentEditContainer.style.display = 'table-cell';
                    saveBtn.style.display = 'inline-block';
                    this.style.display = 'none';
                    
                    textarea.focus();
                }
            });
        });
        
        // Save button click handler
        document.querySelectorAll('.save-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                const id = this.getAttribute('data-id');
                const contentDisplay = document.getElementById('content-display-' + id);
                const contentEditContainer = document.getElementById('content-edit-' + id);
                const textarea = document.getElementById('textarea-' + id);
                const editBtn = document.querySelector('.edit-btn[data-id="' + id + '"]');
                
                if (contentDisplay && contentEditContainer && textarea && editBtn) {
                    const content = textarea.value;
                    
                    contentDisplay.innerText = content;
                    contentDisplay.style.display = 'table-cell';
                    contentEditContainer.style.display = 'none';
                    this.style.display = 'none';
                    editBtn.style.display = 'inline-block';
                    
                    // Get newsId from the hidden link in the row
                    const tr = btn.closest('tr');
                    const viewBtn = tr.querySelector('.btn-info');
                    const newsId = viewBtn.getAttribute('href').split('/')[2];
                    
                    // Submit form with updated content
                    document.getElementById('editNoticeId').value = id;
                    document.getElementById('editNoticeContent').value = content;
                    document.getElementById('editNoticeNewsId').value = newsId;
                    
                    document.getElementById('editNoticeForm').action = '/notices/' + id;
                    document.getElementById('editNoticeForm').submit();
                }
            });
        });
        
        // Enter key handler for content edit
        document.querySelectorAll('textarea').forEach(function(textarea) {
            textarea.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    const id = this.getAttribute('id').replace('textarea-', '');
                    const saveBtn = document.querySelector('.save-btn[data-id="' + id + '"]');
                    if (saveBtn) {
                        saveBtn.click();
                    }
                }
            });
        });
    });
</script>
</body>
</html>
