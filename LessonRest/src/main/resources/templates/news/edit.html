<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit News</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<h1 th:text="${news.title}">News Title</h1>

<!--<p><strong>ID:</strong> <span th:text="${news.id}">1</span></p>-->
<p><strong>Editor:</strong> <span th:text="${editorName != null ? editorName : 'N/A'}">Editor Name</span></p>
<p><strong>Created:</strong> <span th:text="${news.created}">2026-07-03</span></p>
<p><strong>Modified:</strong> <span th:text="${news.modified}">2026-07-03</span></p>

<!--<h2>Stickers</h2>
<ul th:each="sticker : ${stickers}">
    <li th:text="${sticker.name}">Sticker name</li>
</ul>

<h2>Notices</h2>
<ul th:each="notice : ${notices}">
    <li th:text="${notice.content}">Notice content</li>
</ul>-->

<form th:action="@{/news/{id}(id=${news.id})}" method="post" style="margin-top: 20px;">
    <p><strong>Title:</strong> <input type="text" name="title" th:value="${news.title}" style="width: 100%;"></p>
    <p><strong>Content:</strong> <textarea name="content" rows="5" style="width: 100%;" th:text="${news.content}"></textarea></p>
    <button type="submit" class="btn btn-primary">Записать</button>
</form>

<a th:href="@{/news}" style="color: blue; font-size: 17px; margin-left: 10px;">Back to News</a>

</body>
</html>
